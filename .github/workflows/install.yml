name: install

# Ubuntu runner 固定为 24.04：ubuntu-latest 将于 2026-10-19 起迁移到 Ubuntu 26，
# 固定版本可避免构建环境在迁移当天被静默替换。
on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
      - "config.template.json"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
      - "config.template.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  meta:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi
          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  windows:
    needs: meta
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        arch: [aarch64, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Resolve MaaFramework version
        id: maa_version
        shell: bash
        run: |
          tag=$(curl -s -H "authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/MaaXYZ/MaaFramework/releases/latest" \
            | python -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          maafw_version=${tag#v}
          if [[ ! $maafw_version =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Unexpected MaaFramework tag: '${tag}'" >&2
            exit 1
          fi
          echo "MaaFramework latest: ${tag} -> maafw ${maafw_version}"
          echo "tag=${tag}" | tee -a "$GITHUB_OUTPUT"
          echo "maafw_version=${maafw_version}" | tee -a "$GITHUB_OUTPUT"

      - name: Verify maafw version on PyPI
        shell: bash
        env:
          MAAFW_VERSION: ${{ steps.maa_version.outputs.maafw_version }}
        run: |
          for i in 1 2 3; do
            if curl -sf "https://pypi.org/pypi/maafw/json" | python -c "import json,sys,os; v=os.environ['MAAFW_VERSION']; files=(json.load(sys.stdin).get('releases') or {}).get(v) or []; sys.exit(0 if files else 1)"; then
              echo "PyPI has maafw ${MAAFW_VERSION}"
              exit 0
            fi
            echo "PyPI missing maafw ${MAAFW_VERSION} (attempt ${i}/3), retry in 60s..."
            sleep 60
          done
          echo "ERROR: maafw ${MAAFW_VERSION} not found on PyPI" >&2
          exit 1

      - name: Download MFAAvalonia
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MFAAvalonia
          fileName: "MFAAvalonia-*-win-x64*"
          latest: true
          out-file-path: "install"
          extract: true

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-win-${{ matrix.arch }}*"
          tag: ${{ steps.maa_version.outputs.tag }}
          out-file-path: "deps"
          extract: true

      - name: Setup Embed Python
        shell: powershell
        run: |
          ./tools/ci/setup_embed_python.ps1

      - name: Rename MFAAvalonia to MaaGakumasu
        shell: bash
        run: |
          # 查找 MFAAvalonia.exe 的位置
          exe_path=$(find install -name "MFAAvalonia.exe" | head -n 1)
          
          if [ -z "$exe_path" ]; then
            echo "Warning: MFAAvalonia.exe not found in install directory."
            exit 1
          fi
          
          echo "Found MFAAvalonia.exe at: $exe_path"
          
          # 获取目录路径
          exe_dir=$(dirname "$exe_path")
          
          # 重命名为 MaaGakumasu.exe
          mv "$exe_path" "$exe_dir/MaaGakumasu.exe"
          
          if [ $? -eq 0 ]; then
            echo "MFAAvalonia.exe renamed to MaaGakumasu.exe successfully"
          else
            echo "Failed to rename MFAAvalonia.exe"
            exit 1
          fi

      - name: Generate multi-resolution ICO
        shell: bash
        run: |
          # 优先使用高分辨率源 PNG（1024x1024），回退到 logo.ico
          source_file="logo.png"
          if [ ! -f "$source_file" ]; then
            source_file="logo.ico"
          fi
          if [ ! -f "$source_file" ]; then
            echo "Warning: No icon source file found."
            exit 0
          fi
          echo "Using source: $source_file"

          # 安装 Pillow 并从高分辨率源生成多分辨率 ICO
          pip install Pillow
          python -c "
          from PIL import Image
          img = Image.open('$source_file')
          sizes = [(16,16), (24,24), (32,32), (48,48), (64,64), (128,128), (256,256)]
          img.save('logo_multi.ico', format='ICO', sizes=sizes)
          print(f'Generated multi-resolution ICO from {img.size} source with sizes:', sizes)
          "

      - name: Modify MaaGakumasu exe icon
        shell: bash
        run: |
          # 根据架构选择 rcedit 版本
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            rcedit_url="https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          else
            rcedit_url="https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x86.exe"
          fi

          # 下载 rcedit
          echo "Downloading rcedit for ${{ matrix.arch }}..."
          curl -L "$rcedit_url" -o rcedit.exe

          # 查找 MaaGakumasu.exe 的位置
          exe_path=$(find install -name "MaaGakumasu.exe" | head -n 1)

          if [ -z "$exe_path" ]; then
            echo "Warning: MaaGakumasu.exe not found in install directory."
            exit 0
          fi

          echo "Found MaaGakumasu.exe at: $exe_path"

          # 使用多分辨率 ICO（优先）或原始 ICO
          icon_file="logo.ico"
          if [ -f "logo_multi.ico" ]; then
            icon_file="logo_multi.ico"
            echo "Using multi-resolution ICO"
          fi

          # 修改 exe 图标
          ./rcedit.exe "$exe_path" --set-icon "$icon_file"

          if [ $? -eq 0 ]; then
            echo "MaaGakumasu icon modified successfully"
          else
            echo "Failed to modify MaaGakumasu icon"
            exit 1
          fi

      - name: Install
        shell: bash
        run: |
          # 确定平台标签
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            platform_tag="win-x64"
          else
            platform_tag="win-arm64"
          fi
          
          echo "Building for platform: ${platform_tag}"
          
          # 运行安装脚本，传入版本号和平台标签
          python ./tools/install.py "${{ needs.meta.outputs.tag }}" ${platform_tag} "${{ steps.maa_version.outputs.maafw_version }}"

          # 清理zip文件
          echo "Cleaning up zip files..."
          find install -name "MFAAvalonia-*.zip" -delete 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: MaaGakumasu-win-${{ matrix.arch }}
          path: "install"

  unix:
    needs: meta
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
        arch: [aarch64, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Resolve MaaFramework version
        id: maa_version
        shell: bash
        run: |
          tag=$(curl -s -H "authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/MaaXYZ/MaaFramework/releases/latest" \
            | python -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          maafw_version=${tag#v}
          if [[ ! $maafw_version =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Unexpected MaaFramework tag: '${tag}'" >&2
            exit 1
          fi
          echo "MaaFramework latest: ${tag} -> maafw ${maafw_version}"
          echo "tag=${tag}" | tee -a "$GITHUB_OUTPUT"
          echo "maafw_version=${maafw_version}" | tee -a "$GITHUB_OUTPUT"

      - name: Verify maafw version on PyPI
        shell: bash
        env:
          MAAFW_VERSION: ${{ steps.maa_version.outputs.maafw_version }}
        run: |
          for i in 1 2 3; do
            if curl -sf "https://pypi.org/pypi/maafw/json" | python -c "import json,sys,os; v=os.environ['MAAFW_VERSION']; files=(json.load(sys.stdin).get('releases') or {}).get(v) or []; sys.exit(0 if files else 1)"; then
              echo "PyPI has maafw ${MAAFW_VERSION}"
              exit 0
            fi
            echo "PyPI missing maafw ${MAAFW_VERSION} (attempt ${i}/3), retry in 60s..."
            sleep 60
          done
          echo "ERROR: maafw ${MAAFW_VERSION} not found on PyPI" >&2
          exit 1

      - name: Download MFAAvalonia
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MFAAvalonia
          fileName: "MFAAvalonia-*-${{ startsWith(matrix.os, 'ubuntu') && 'linux' || 'osx' }}-${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}*"
          latest: true
          out-file-path: "install"
          extract: true

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ startsWith(matrix.os, 'ubuntu') && 'linux' || 'macos' }}-${{ matrix.arch }}*"
          tag: ${{ steps.maa_version.outputs.tag }}
          out-file-path: "deps"
          extract: true

      - name: Setup Embed Python (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          chmod +x ./tools/ci/setup_embed_python.sh
          ./tools/ci/setup_embed_python.sh ${{ matrix.arch }}

      - name: Install
        shell: bash
        run: |
          # 确定平台标签
          if [ "$RUNNER_OS" == "Linux" ]; then
            os_name="linux"
          else
            os_name="osx"
          fi
          
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            arch_name="x64"
          else
            arch_name="arm64"
          fi
          
          platform_tag="${os_name}-${arch_name}"
          echo "Building for platform: ${platform_tag}"
          
          # 运行安装脚本，传入版本号和平台标签
          python ./tools/install.py "${{ needs.meta.outputs.tag }}" ${platform_tag} "${{ steps.maa_version.outputs.maafw_version }}"

          # 清理zip文件
          echo "Cleaning up zip files..."
          find install -name "MFAAvalonia-*.zip" -delete 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: MaaGakumasu-${{ startsWith(matrix.os, 'ubuntu') && 'linux' || 'macos' }}-${{ matrix.arch }}
          path: "install"

  changelog:
    name: Generate changelog
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, windows, unix, changelog]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets

      - name: Check assets directory
        run: |
          ls -la assets
          if [ -z "$(ls -A assets)" ]; then
            echo "assets directory is empty"
            exit 1
          fi

      - name: Compress and generate checksums
        run: |
          cd assets
          echo "Generating checksums for all zip files..."
          checksum_file="checksums.sha256"
          touch "$checksum_file"

          for f in *; do
            if [ -d "$f" ]; then
              echo "Processing directory: $f"
              zip_file="$f-${{ needs.meta.outputs.tag }}.zip"
              (cd "$f" && zip -r "../$zip_file" .)
              if [ $? -eq 0 ]; then
                echo "ZIP file created: ../$zip_file"
                echo "Processing directory: $f"
                sha256sum "$zip_file" >> "$checksum_file"
                echo "" >> "$checksum_file"
              else
                echo "Failed to create ZIP file: ../$zip_file"
                exit 1
              fi
            else
              echo "Skipping non-directory: $f"
            fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

      - name: Trigger MirrorChyanUploading
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}